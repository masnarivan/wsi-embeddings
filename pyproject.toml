[project]
name = "wsi-embeddings"
version = "0.1.0"
description = "Whole-slide image tiling + pathology foundation model (Phikon) embeddings on CAMELYON16"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "transformers",
    "openslide-python",
    "openslide-bin",
    "shapely",
    "scikit-image",
    "umap-learn",
    "pandas",
    "pyarrow",
    "matplotlib",
    "scikit-learn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsi"]
